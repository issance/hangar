# Hangar for Windows. It cannot be cross-built from a Mac (ghostty-vt needs MSVC), so it builds here, the way
# upstream's release does: Rust + Zig 0.16 on Windows, packaged with Microsoft's signed ConPTY by
# scripts/package_windows_conpty.ps1. A v* tag uploads to its release; a manual run uploads to the release
# named in "release" (empty: build only).
name: windows
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Release tag to attach the build to, for example v0.9.5"
        required: false
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    env:
      LIBGHOSTTY_VT_OPTIMIZE: ReleaseFast
      LIBGHOSTTY_VT_SIMD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.1"
          targets: x86_64-pc-windows-msvc
      - uses: vercel-labs/setup-zig@v1.0.2
        with:
          version: 0.16.0
      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = Join-Path $env:RUNNER_TEMP "Microsoft.Windows.Console.ConPTY.nupkg"
          $stage = Join-Path $env:RUNNER_TEMP "hangar-windows-x86_64"
          .\scripts\package_windows_conpty.ps1 -HerdrExe target\x86_64-pc-windows-msvc\release\hangar.exe `
            -PackagePath $package -StageDir $stage -OutputPath hangar-windows-x86_64.zip
          $version = (& (Join-Path $stage "hangar.exe") --version | Out-String).Trim()
          Write-Host "built: $version"
          if ($version -notmatch '^hangar ') { throw "unexpected version identity: $version" }
          Copy-Item LICENSE, NOTICE-ISSANCE.md $stage
          tar -czf hangar-windows-x64.tar.gz -C $stage .
          foreach ($f in "hangar-windows-x64.tar.gz", "hangar-windows-x86_64.zip") {
            (Get-FileHash $f -Algorithm SHA256).Hash.ToLower() + "  $f" | Out-File -Encoding ascii "$f.sha256"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: hangar-windows
          path: hangar-windows-*
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release }}
        shell: bash
        run: gh release upload "$TAG" hangar-windows-x64.tar.gz hangar-windows-x64.tar.gz.sha256 hangar-windows-x86_64.zip hangar-windows-x86_64.zip.sha256 --clobber
